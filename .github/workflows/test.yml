name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an upstream release that breaks a fresh install is noticed even when nobody pushes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Tool versions used by the jobs below. Bump them here, in one place.
  UV_VERSION: "0.13.1"
  BUILD_VERSION: "1.6.1"
  TWINE_VERSION: "7.0.0"
  RUFF_VERSION: "0.17.1"
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # Python 3.14 is checked on Linux only: watchdog has no cp314 wheel for macOS yet.
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only torch on Linux keeps the job small)
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q

  mcp-1x:
    name: mcp 1.x SDK
    # The 1.x SDK keeps its own import path in server.py, which the matrix above never reaches.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install with the 1.x SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' 'mcp>=1.21.1,<2'
          python -c "import importlib.metadata as m; v = m.version('mcp'); assert v.startswith('1.'), v; print('mcp', v)"
      - name: Test
        run: python -m pytest -q

  lowest-direct:
    name: lowest allowed dependencies
    # The lowest version of every direct dependency that pyproject.toml allows.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the lowest allowed versions (CPU-only torch)
        run: |
          python -m pip install --upgrade pip "uv==${UV_VERSION}"
          python -m venv "$RUNNER_TEMP/lowest"
          uv pip install --python "$RUNNER_TEMP/lowest/bin/python" --resolution lowest-direct --torch-backend cpu -e '.[dev]'
          uv pip list --python "$RUNNER_TEMP/lowest/bin/python"
      - name: Test
        run: |
          "$RUNNER_TEMP/lowest/bin/python" -m pytest -q

  build:
    name: build and installed wheel
    # Builds the sdist and wheel, checks the metadata and runs the suite against the installed wheel.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade pip "build==${BUILD_VERSION}" "twine==${TWINE_VERSION}"
          python -m build
          python -m twine check --strict dist/*
      - name: Build with the oldest hatchling that pyproject.toml allows
        run: |
          echo "hatchling==1.27.0" > "$RUNNER_TEMP/hatchling-floor.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/hatchling-floor.txt" python -m build --wheel --outdir "$RUNNER_TEMP/dist-floor"
          python -m twine check --strict "$RUNNER_TEMP"/dist-floor/*
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          wheel="$(ls dist/*.whl)"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install "${wheel}[dev]"
          "$RUNNER_TEMP/wheel-env/bin/puremind" --version
      - name: Test the installed package
        env:
          # tests/conftest.py then leaves the source tree off sys.path, so the tests import the wheel.
          PUREMIND_TEST_INSTALLED: "1"
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" -m pytest -q

  real-models:
    name: real models
    # The other jobs use stand-in models. Weekly, and on demand, this one downloads the two pinned models
    # (about 3.5 GB) and runs the smoke test that loads them, so a library change that breaks them is noticed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Smoke test with the real models
        env:
          HF_HOME: ${{ runner.temp }}/hf
          PUREMIND_REAL_MODEL_TESTS: "1"
        run: |
          python -m pytest -q tests/test_models.py::test_real_models_rank_the_relevant_passage_first | tee "$RUNNER_TEMP/real.txt"
          grep -q "1 passed" "$RUNNER_TEMP/real.txt"  # a skipped test would otherwise pass quietly

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ruff (default rule set)
        run: |
          python -m pip install "ruff==${RUFF_VERSION}"
          ruff check src tests bench

  audit:
    name: pip-audit
    # Resolves the dependencies a new install gets today, without installing them, and audits the result.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install "uv==${UV_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
          uv pip compile pyproject.toml --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --output-file "$RUNNER_TEMP/resolved.txt"
          pip-audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/resolved.txt"

  secrets:
    name: gitleaks
    # gitleaks CLI with the repository's .gitleaks.toml. The release is pinned by version and checksum.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .
