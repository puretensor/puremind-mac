[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "puremind-mac"
dynamic = ["version"]
description = "Local memory for AI coding agents: a Markdown vault, hybrid retrieval and a read-only MCP server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "PureTensor, Inc." }]
keywords = ["mcp", "memory", "agents", "markdown", "retrieval", "obsidian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Every lower bound is the lowest release that was run (the CI job "lowest allowed dependencies" installs them).
# The large, fast-moving libraries are also capped at the next major release.
dependencies = [
  "numpy>=1.26",
  "bm25s>=0.2.7.post1",  # 0.2.7 itself is yanked
  "PyStemmer>=2.2.0.2",  # 2.2.0 and 2.2.0.1 have no wheels, and 2.2.0 does not build
  "sentence-transformers>=5.6.0,<7",  # 5.6.0 fixes CVE-2026-68770: a local model directory could run Python code
  "transformers>=4.51.1,<6",  # Qwen3 needs 4.51; 4.51.0 cannot load a model without accelerate
  "huggingface-hub>=0.30.0,<2",  # what transformers 4.51.1 requires
  "torch>=2.6,<3",  # 2.6.0 fixes the torch.load flaw CVE-2025-32434
  "mcp>=1.21.1,<3",  # 1.21.0 and earlier fail to import with current pydantic
  "pydantic>=2.11,<3",  # server.py imports it for the tool parameter bounds; 2.11 is what mcp 1.21.1 needs
  "watchdog>=5.0.3",  # earlier releases can hang on stop after watching a directory they cannot read
]

[project.urls]
Homepage = "https://github.com/puretensor/puremind-mac"
Source = "https://github.com/puretensor/puremind-mac"
Issues = "https://github.com/puretensor/puremind-mac/issues"
Changelog = "https://github.com/puretensor/puremind-mac/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
puremind = "puremind_mac.cli:main"

[tool.hatch.version]
path = "src/puremind_mac/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/puremind_mac"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# These two files decide whether to put the source tree on sys.path before they import the package.
"tests/conftest.py" = ["E402"]
"bench/longmemeval.py" = ["E402"]
# Tests catch everything a worker thread raises, so the main thread can re-raise it.
"tests/**" = ["BLE001"]
